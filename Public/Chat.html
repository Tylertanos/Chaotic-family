<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chaotic Family Chat</title>
<style>
body { background:black; color:green; font-family:monospace; margin:0; padding:0; display:flex; flex-direction:column; height:100vh; }
#chat { flex:1; overflow-y:auto; padding:10px; }
input, button { background:#000; color:green; border:1px solid green; padding:5px; margin:5px; }
.deleted-message { font-style:italic; color:gray; }
.message { margin-bottom:5px; }
</style>
</head>
<body>
<div id="chat"></div>
<div>
<input id="msg" placeholder="Type message">
<button onclick="sendMsg()">Send</button>
</div>
<script>
const ws = new WebSocket("ws://"+location.host);
const token = localStorage.getItem("token");
const chat = document.getElementById("chat");
let messages = [];

ws.onmessage = (event)=>{
  const data = JSON.parse(event.data);
  if(data.type==="init") messages = data.messages;
  if(data.type==="message") messages.push(data.message);
  if(data.type==="update"){
    const idx = messages.findIndex(m=>m.id===data.message.id);
    if(idx!==-1) messages[idx]=data.message;
  }
  render();
}

function render(){
  chat.innerHTML="";
  messages.forEach(m=>{
    const div=document.createElement("div");
    div.className="message";
    if(m.deleted) div.classList.add("deleted-message");
    div.textContent=`[${new Date(m.time).toLocaleTimeString()}] ${m.user}: ${m.text}`;
    if(!m.deleted && m.user===localStorage.getItem("username")){
      const btn=document.createElement("button");
      btn.textContent="Delete";
      btn.onclick=()=>deleteMsg(m.id);
      div.appendChild(btn);
    }
    chat.appendChild(div);
  });
  chat.scrollTop=chat.scrollHeight;
}

function sendMsg(){
  const text=document.getElementById("msg").value;
  if(!text) return;
  ws.send(JSON.stringify({type:"message", text, token}));
  document.getElementById("msg").value="";
}

function deleteMsg(id){
  ws.send(JSON.stringify({type:"delete", id, token}));
}
</script>
</body>
</html>
